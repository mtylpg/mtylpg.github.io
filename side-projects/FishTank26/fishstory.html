    <style>
        :root{
            --fishbod:#fff;
            --fishbord:#000;
            --fishhigh:#330000;
        }
        #fishPic{
            background-image: url("shaderexpsvg.svg");
        }
        #fishFrame{
            height: 256px;
            width: 768px;
            overflow: clip;
            animation: fishbob 2s;
       /* -moz-animation: fishbob 2s 2s 1; */
    /* -webkit-animation: fishbob 7s 2s 1; */
         /* -o-animation: fishbob 7s 2s 1; */
            animation-iteration-count: infinite;
            animation-timing-function: ease;
        }
        body{
            background-image: url("tankbg.png");
            background-size: cover;
            background-position: center;
            margin:auto;
            width: fit-content;
            text-align: center;
        }
        @keyframes fishbob {
            0% { padding-top: 0; }
            50% { padding-top: 5px }
            100% { padding-top: 0; }
        }
        svg{
            zoom: 400%;
            transform: scaleX(-1)
        }
    </style>

    <script>
        $.getJSON("fishstory.json", function(json) {
            console.log(json);
            tankData = json["Data"];
            fishData = json["Fish"];
            // randomFish()
        });

        function searchBadge(){
            fish_id = $("#badgeInput").val()
            tempID = fish_id[1]+fish_id[4]+fish_id[3]+fish_id.substr(5)
            loadFish(tempID)
        }
        function loadFish(fish_id){
            $("#fishFrame").show()
            if(!fishData[fish_id]){
                $("#fname").text("Fish not found")
                resetFish();
                return
            }
            data = fishData[fish_id]
            $("#fname").text(data[0])
            $("#nature").text(data[1])
            $("#team").text(data[6])
            $("#birthday").text(data[7])
            $("#food").text("Fed "+data[9]+" times")
            $("#perfect").text(data[11]+" perfects")
            $("#scans").text("Scanned "+data[8]+" times")
            $("svg").css("margin-top", -64*(data[3])+"px")
            $(".fbody").css("fill", "#"+data[2][0])
            $(".fborder").css("fill", "red")
            $("#fishFrame").css("zoom", 100+(2*data[9])+"%")
        }

        function randomFish(){
            fishKeys = Object.keys(fishData)
            $("#badgeInput").val(fishKeys[Math.floor(Math.random() * (fishKeys.length+ 1))]);
            loadFish($("#badgeInput").val())
        }

        function resetFish(){
            if(fishData){

            }
        }

    </script>
